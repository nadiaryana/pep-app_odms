<div class="container-top-bar"
     fxLayout="row wrap"
     fxLayoutAlign="start center"
     fxLayoutGap="10px">

  <mat-form-field class="filter">
    <mat-label>Sumur</mat-label>
    <mat-select [formControl]="wellControl" placeholder="Pilih sumur">
      <mat-option *ngFor="let well of wells" [value]="well">{{ well }}</mat-option>
    </mat-select>
  </mat-form-field>

  <mat-form-field class="filter">
    <mat-label>Start Date</mat-label>
    <input matInput
           [matDatepicker]="start_datePicker"
           [formControl]="startDateControl"
           placeholder="Pilih tanggal mulai">
    <mat-datepicker-toggle matSuffix [for]="start_datePicker"></mat-datepicker-toggle>
    <mat-datepicker #start_datePicker></mat-datepicker>
  </mat-form-field>

  <mat-form-field class="filter">
    <mat-label>End Date</mat-label>
    <input matInput
           [matDatepicker]="end_datePicker"
           [formControl]="endDateControl"
           placeholder="Pilih tanggal akhir">
    <mat-datepicker-toggle matSuffix [for]="end_datePicker"></mat-datepicker-toggle>
    <mat-datepicker #end_datePicker></mat-datepicker>
  </mat-form-field>

  <!-- <button mat-raised-button color="primary"
          (click)="loadChart()"
          [disabled]="isLoadingResults || !wellControl.value">
    <mat-icon>refresh</mat-icon> Tampilkan
  </button> -->
</div>

<div *ngIf="errorMessage" class="chart-error">{{ errorMessage }}</div>

<mat-card class="chart-card">
  <mat-card-content>
    <div class="chart-info" *ngIf="totalPoints > 0">
      {{ totalPoints | number }} data arus
    </div>
    <mat-progress-bar *ngIf="isLoadingResults" mode="indeterminate"></mat-progress-bar>

    <div #iot_chart_el
         class="iot_chart"
         *ngIf="totalPoints > 0"></div>

    <div *ngIf="!isLoadingResults && totalPoints === 0" class="no-data">
      Belum ada data arus pada rentang tanggal yang dipilih.
    </div>
  </mat-card-content>
</mat-card>
