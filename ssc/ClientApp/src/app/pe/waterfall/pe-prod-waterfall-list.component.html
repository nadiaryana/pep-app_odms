<div class="container-top-bar" [ngClass.gt-sm]="'top-flow'" [ngClass.lt-md]="'top-flow-xs'">
  <!--mat-form-field>
    <input matInput placeholder="Filter" [formControl]="filterControl">
  </mat-form-field-->
  <button mat-button color="primary" [disabled]="isLoadingResults" [routerLink]="['/pe/pump/add']" *ngIf="pePermissionService.passPermission('pe/pump/add')"><mat-icon>add</mat-icon> Add/Edit</button>
  <button mat-button color="warn" (click)="deleteSelected()" [disabled]="!selection.selected.length" *ngIf="pePermissionService.passPermission('pe/pump/delete')"><mat-icon>delete</mat-icon> Delete Selected</button>
  <button mat-button color="secondary" (click)="exportExcel()" [disabled]="isLoadingResults"><mat-icon>file_download</mat-icon> Export to Excel</button>
  
</div>

<div class="container-content" [ngClass.gt-sm]="'top-flow'" [ngClass.lt-md]="'top-flow-xs'">
  
  <div class="loading-shade" *ngIf="isLoadingResults || isRateLimitReached">
    <mat-spinner *ngIf="isLoadingResults"></mat-spinner>
  </div>

  <div class="container-table" [style.max-height]="(commonService.Math.max(commonService.screenHeight - 180, 250))+'px'">

    <table mat-table [dataSource]="dataSource" class="pe-table"
    matSort matSortActive="date" matSortDisableClear matSortDirection="desc">

    <ng-container matColumnDef="select">
      <th mat-header-cell *matHeaderCellDef rowspan="2">
        <mat-checkbox (change)="($event && !isEditing) ? masterToggle() : null"
          [checked]="selection.hasValue() && isAllSelected()"
          [indeterminate]="selection.hasValue() && !isAllSelected()"
          [aria-label]="checkboxLabel()"
          [disabled]="isEditing" *ngIf="pePermissionService.passPermission('pe/daily/delete')">
        </mat-checkbox>
      </th>
      <td mat-cell *matCellDef="let row">
        <mat-checkbox (click)="$event.stopPropagation()"
          (change)="($event && !isEditing) ? selection.toggle(row) : null"
          [checked]="selection.isSelected(row)"
          [aria-label]="checkboxLabel(row)"
          [disabled]="isEditing" *ngIf="pePermissionService.passPermission('pe/daily/delete')">
        </mat-checkbox>
      </td>
    </ng-container>
    
    <ng-container matColumnDef="nomor">
            <th mat-header-cell *matHeaderCellDef>
              <div fxLayout="row" fxLayoutAlign="start center">
                <span mat-sort-header arrowPosition="before" class="mat-sort-header">No. PU</span>
                <app-xfilter title="Nomor" column="nomor" format="number" [selected]="nomor_xSelected"></app-xfilter>
              </div>
          </th>
          <td mat-cell *matCellDef="let row" class="cell-right" [class.clicked_row]="selection.isSelected(row)">{{row.nomor  || '-'}}</td>
        </ng-container>

      <ng-container matColumnDef="well" sticky>
        <th mat-header-cell *matHeaderCellDef>
          <div fxLayout="row" fxLayoutAlign="start center">
            <span mat-sort-header arrowPosition="before">Sumur Produksi</span>
            <app-xfilter title="Nama Sumur" column="well" [selected]="well_xSelected"></app-xfilter>
          </div>
      </th>
        <td mat-cell *matCellDef="let row" class="cell-center" [class.clicked_row]="selection.isSelected(row)">
          <ng-container *ngIf="!row.isEdit; else editNama">
            {{ row.well }}
          </ng-container><ng-template #editNama>
            <input
              matInput
              [(ngModel)]="row.well"
              (keydown.enter)="save(row)"
              (keydown.escape)="cancel(row)"
              autofocus>
          </ng-template>
        </td>
      </ng-container>

      <ng-container matColumnDef="delta_prod">
        <th mat-header-cell *matHeaderCellDef>
          <div fxLayout="row" fxLayoutAlign="start center">
            <span mat-sort-header arrowPosition="before">Delta Production</span>
            <app-xfilter title="Delta Production" column="delta_prod" [selected]="delta_prod_xSelected"></app-xfilter>
          </div>
      </th>
        <td mat-cell *matCellDef="let row" class="cell-center" [class.clicked_row]="selection.isSelected(row)">
          <ng-container *ngIf="!row.isEdit; else editNama">
            {{ row.delta_prod }}
          </ng-container><ng-template #editNama>
            <input
              matInput
              [(ngModel)]="row.delta_prod"
              (keydown.enter)="save(row)"
              (keydown.escape)="cancel(row)"
              autofocus>
          </ng-template>
        </td>
      </ng-container>

        
        <ng-container matColumnDef="remarks">
          <th mat-header-cell *matHeaderCellDef rowspan="2">
            <div fxLayout="row" fxLayoutAlign="start center">
              <span mat-sort-header arrowPosition="before" class="mat-sort-header">Remarks</span>
              <app-xfilter title="Remarks" column="remarks" [selected]="remarks_xSelected"></app-xfilter>
            </div>
          </th>
          <td mat-cell *matCellDef="let row" class="cell-center" [class.clicked_row]="selection.isSelected(row)">
            <ng-container *ngIf="!row.isEdit; else editNama">
              {{row.remarks || '-'}}
            </ng-container><ng-template #editNama>
              <input
                matInput
                [(ngModel)]="row.remarks"
                (keydown.enter)="save(row)"
                (keydown.escape)="cancel(row)"
                autofocus>
            </ng-template>
          </td>
        </ng-container>

    <ng-container matColumnDef="action" stickyEnd>
      <th mat-header-cell *matHeaderCellDef class="cell-center action-column" rowspan="2">
        Action
      </th>
      <td mat-cell *matCellDef="let row" class="cell-center action-column">
        <button
          mat-icon-button
          color="primary"
          *ngIf="!row.isEdit && pePermissionService.passPermission('pe/pump/edit')"
          (click)="edit(row)"
          matTooltip="Edit">
          <mat-icon>edit</mat-icon>
        </button>

        <ng-container *ngIf="row.isEdit">
          <button
            mat-icon-button
            color="accent"
            (click)="save(row)"
            matTooltip="Save">
            <mat-icon>check</mat-icon>
          </button>

          <button
            mat-icon-button
            color="warn"
            (click)="cancel(row)"
            matTooltip="Cancel">
            <mat-icon>close</mat-icon>
          </button>
        </ng-container>
      </td>
    </ng-container>


    <tr mat-header-row *matHeaderRowDef="headerColumns1"></tr>
    <!-- <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr> -->
   <tr mat-row *matRowDef="let row; columns: displayedColumns;" (click)="selection.toggle(row)"></tr>
 </table>
</div>

<mat-paginator [length]="resultsLength"  [pageSizeOptions]="[50, 100, 500, 1000]"></mat-paginator>
<router-outlet></router-outlet>
  <router-outlet name="overlay2"></router-outlet>
</div>
