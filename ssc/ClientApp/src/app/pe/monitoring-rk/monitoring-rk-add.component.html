<!-- Form manual input Monitoring RK — mirip seperti add-osg -->
<div class="container-content form-report">
  <h3>Add Monitoring RK</h3>

  <div [formGroup]="rkForm">
    <ng-container formArrayName="items">
      <!-- Loop tiap baris item -->
      <mat-grid-list cols="16" *ngFor="let item of items?.controls; let index=index">
        
        <mat-grid-tile [colspan]="2" [rowspan]="1">
          <mat-form-field floatLabel="never" [formGroupName]="index">
            <mat-label>Well</mat-label>
            <input matInput formControlName="well" placeholder="Well name" />
          </mat-form-field>
        </mat-grid-tile>

        <mat-grid-tile [colspan]="2" [rowspan]="1">
          <mat-form-field floatLabel="never" [formGroupName]="index">
            <mat-label>Job</mat-label>
            <input matInput formControlName="job" placeholder="Job type" />
          </mat-form-field>
        </mat-grid-tile>

        <mat-grid-tile [colspan]="2" [rowspan]="1">
          <mat-form-field floatLabel="never" [formGroupName]="index">
            <mat-label>Rig</mat-label>
            <input matInput formControlName="rig" placeholder="Rig name" />
          </mat-form-field>
        </mat-grid-tile>

        <mat-grid-tile [colspan]="2" [rowspan]="1">
          <mat-form-field floatLabel="never" [formGroupName]="index">
            <mat-label>Plan Start</mat-label>
            <input matInput [matDatepicker]="planStartPicker" formControlName="plan_start">
            <mat-datepicker-toggle matSuffix [for]="planStartPicker"></mat-datepicker-toggle>
            <mat-datepicker #planStartPicker></mat-datepicker>
          </mat-form-field>
        </mat-grid-tile>

        <mat-grid-tile [colspan]="2" [rowspan]="1">
          <mat-form-field floatLabel="never" [formGroupName]="index">
            <mat-label>Plan End</mat-label>
            <input matInput [matDatepicker]="planEndPicker" formControlName="plan_end">
            <mat-datepicker-toggle matSuffix [for]="planEndPicker"></mat-datepicker-toggle>
            <mat-datepicker #planEndPicker></mat-datepicker>
          </mat-form-field>
        </mat-grid-tile>

        <mat-grid-tile [colspan]="2" [rowspan]="1">
          <mat-form-field floatLabel="never" [formGroupName]="index">
            <mat-label>POP</mat-label>
            <input matInput [matDatepicker]="popPicker" formControlName="pop">
            <mat-datepicker-toggle matSuffix [for]="popPicker"></mat-datepicker-toggle>
            <mat-datepicker #popPicker></mat-datepicker>
          </mat-form-field>
        </mat-grid-tile>

        <mat-grid-tile [colspan]="2" [rowspan]="1">
          <mat-form-field floatLabel="never" [formGroupName]="index">
            <mat-label>Target Oil</mat-label>
            <input matInput formControlName="target_oil" type="number" placeholder="Target oil" />
          </mat-form-field>
        </mat-grid-tile>

        <mat-grid-tile [colspan]="2" [rowspan]="1">
          <mat-form-field floatLabel="never" [formGroupName]="index">
            <mat-label>Target Gas</mat-label>
            <input matInput formControlName="target_gas" type="number" placeholder="Target gas" />
          </mat-form-field>
        </mat-grid-tile>

        <mat-grid-tile [colspan]="2" [rowspan]="1">
          <mat-form-field floatLabel="never" [formGroupName]="index">
            <mat-label>Realisasi Oil</mat-label>
            <input matInput formControlName="realisasi_oil" type="number" placeholder="Realisasi oil" />
          </mat-form-field>
        </mat-grid-tile>

        <mat-grid-tile [colspan]="2" [rowspan]="1">
          <mat-form-field floatLabel="never" [formGroupName]="index">
            <mat-label>Realisasi Gas</mat-label>
            <input matInput formControlName="realisasi_gas" type="number" placeholder="Realisasi gas" />
          </mat-form-field>
        </mat-grid-tile>

        <mat-grid-tile [colspan]="2" [rowspan]="1">
          <mat-form-field floatLabel="never" [formGroupName]="index">
            <mat-label>Remarks</mat-label>
            <input matInput formControlName="remarks" placeholder="Remarks" />
          </mat-form-field>
        </mat-grid-tile>

        <!-- Tombol tambah/hapus baris -->
        <mat-grid-tile [colspan]="1" [rowspan]="1">
          <button mat-button color="basic" (click)="addRow()"><mat-icon>add</mat-icon></button>
        </mat-grid-tile>
        <mat-grid-tile [colspan]="1" [rowspan]="1" *ngIf="index > 0">
          <button mat-button color="basic" (click)="removeRow(index)"><mat-icon>delete</mat-icon></button>
        </mat-grid-tile>
      </mat-grid-list>
    </ng-container>

    <!-- Loading spinner saat menyimpan -->
    <div class="loading-shade" *ngIf="isLoading">
      <mat-spinner></mat-spinner>
    </div>

    <!-- Tombol aksi -->
    <button mat-raised-button color="secondary" (click)="onSave()" [disabled]="!rkForm.valid || isLoading">
      <mat-icon>save</mat-icon> Save
    </button>
    <span class="margin-10"></span>
    <button mat-raised-button (click)="backToList()">
      <mat-icon>list</mat-icon> Back to List
    </button>
  </div>
</div>
