<div class="container-top-bar" [ngClass.gt-sm]="'top-flow'" [ngClass.lt-md]="'top-flow-xs'" >
  <!-- Dropdown chart type (rig/rigless) -- letakkan paling depan -->
  <mat-form-field class="filter" floatLabel="never">
    <mat-label>Chart Type</mat-label>
    <mat-select [(value)]="selectedChartType" (selectionChange)="onChartTypeChange()">
      <mat-option *ngFor="let ct of chartTypes" [value]="ct.value">
        {{ ct.label }}
      </mat-option>
    </mat-select>
  </mat-form-field>

  <!-- Filter Well (xFilter seperti area chart) -->
  <mat-form-field class="field-well" floatLabel="never">
    <input matInput
      [(ngModel)]="well_xSelected"
      disabled>
    <app-xfilter
      title="Well"
      column="well"
      [selected]="well_xSelected">
    </app-xfilter>
  </mat-form-field>

  <!-- Filter Start Date -->
  <mat-form-field class="filter" floatLabel="never">
    <mat-label>Start Date</mat-label>
    <input matInput [matDatepicker]="startPicker" [(ngModel)]="startDate" (dateChange)="onFilterChange()" placeholder="Pilih tanggal">
    <mat-datepicker-toggle matSuffix [for]="startPicker"></mat-datepicker-toggle>
    <mat-datepicker #startPicker></mat-datepicker>
  </mat-form-field>

  <!-- Filter End Date -->
  <mat-form-field class="filter" floatLabel="never">
    <mat-label>End Date</mat-label>
    <input matInput [matDatepicker]="endPicker" [(ngModel)]="endDate" (dateChange)="onFilterChange()" placeholder="Pilih tanggal">
    <mat-datepicker-toggle matSuffix [for]="endPicker"></mat-datepicker-toggle>
    <mat-datepicker #endPicker></mat-datepicker>
  </mat-form-field>

  <button mat-button [routerLink]="['/pe/monitoring-rk/list']">
    <mat-icon>list</mat-icon> Back to List
  </button>
</div>

<div class="container-content" [ngClass.gt-sm]="'top-flow'" [ngClass.lt-md]="'top-flow-xs'">
  
  <!-- Loading Indicator -->
  <div class="loading-shade" *ngIf="isLoading">
    <mat-spinner></mat-spinner>
  </div>

  <!-- Filter Message: tampil jika filter belum lengkap -->
  <div *ngIf="!isLoading && !chartReady && chartData.length === 0 && filterMessage" class="no-data">
    <mat-icon>info</mat-icon>
    <p>{{ filterMessage }}</p>
  </div>

  <!-- Column Chart: 4 grouped columns per well -->
   <mat-card class="chart-card" *ngIf="chartReady">
    <div class="chart-card" [hidden]="isLoading || chartData.length === 0">
      <div #columnChart class="per_area_chart"></div>
    </div>
  </mat-card>

  <!-- Selisih Chart: persentase selisih -->
   <mat-card class="chart-card" *ngIf="chartReady">
    <div class="chart-card" [hidden]="isLoading || chartData.length === 0" style="margin-top: 16px;">
      <div #selisihChart class="per_area_chart"></div>
    </div>
  </mat-card>

  <!-- No Data Message (chart siap tapi data kosong) -->
  <div *ngIf="chartReady && !isLoading && chartData.length === 0 && !filterMessage" class="no-data">
    <mat-icon>info</mat-icon>
    <p>No data available.</p>
  </div>
</div>
