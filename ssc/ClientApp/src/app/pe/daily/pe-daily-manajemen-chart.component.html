<div class="container-top-bar top-flow" fxLayoutGap="10px">

	<mat-form-field class="field-well" floatLabel="never">
    <mat-label>Area</mat-label>
    <!-- <input matInput [value]="area_xSelected?.join(', ')" readonly /> -->
    <input matInput [(ngModel)]="area_xSelected" disabled>
    <app-xfilter
      title="Area"
      column="area"
      [selected]="area_xSelected">
    </app-xfilter>
  </mat-form-field>

  <!-- <mat-form-field class="field-area" floatLabel="never">
    <input matInput [(ngModel)]="area_xSelected" disabled />
    <app-xfilter
      title="Area"
      column="area"
      [selected]="area_xSelected">
    </app-xfilter>
  </mat-form-field> -->

  <!-- <mat-form-field class="field-well" floatLabel="never">
    <input matInput [(ngModel)]="well_xSelected" disabled />
    <app-xfilter
      title="Well"
      column="well"
      [selected]="well_xSelected"
    ></app-xfilter>
  </mat-form-field> -->

  <mat-form-field class="filter" floatLabel="never">
    <mat-label>Start Date</mat-label>
    <input
      matInput
      class="input-hidden"
      [matDatepicker]="start_datePicker"
      [formControl]="start_dateControl"
      (dateChange)="start_dateChange($event)"
      readonly
    />
    <input matInput [(ngModel)]="start_dateInput" disabled />
    <mat-datepicker-toggle
      matSuffix
      [for]="start_datePicker"
      [disabled]="isLoadingResults"
    ></mat-datepicker-toggle>
    <mat-datepicker #start_datePicker disabled="false"></mat-datepicker>
  </mat-form-field>
  <mat-form-field class="filter" floatLabel="never">
    <mat-label>End Date</mat-label>
    <input
      matInput
      class="input-hidden"
      [matDatepicker]="end_datePicker"
      [formControl]="end_dateControl"
      (dateChange)="end_dateChange($event)"
      readonly
    />
    <input matInput [(ngModel)]="end_dateInput" disabled />
    <mat-datepicker-toggle
      matSuffix
      [for]="end_datePicker"
      [disabled]="isLoadingResults"
    ></mat-datepicker-toggle>
    <mat-datepicker #end_datePicker disabled="false"></mat-datepicker>
  </mat-form-field>
</div>

<div fxLayout="row" fxLayout.lt-lg="column" fxLayoutWrap fxLayoutGap="10px" fxLayoutAlign="center">
  <div fxFlex="50%" fxLayout="column" fxLayoutGap="5px">
    <mat-card fxFlex="100%" class="dasboard_card">
      <div #manajemen_chart_el class="manajemen_chart"></div>
    </mat-card>
  </div>

    </mat-card>
  </div> -->
</div>
