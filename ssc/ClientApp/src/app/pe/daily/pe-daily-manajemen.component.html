<!-- Baris tombol aksi: aksi utama di kiri, Delete Selected & Chart di kanan -->
<div class="table-action-bar">
  <button mat-stroked-button color="primary" [disabled]="isLoadingResults" [routerLink]="['/pe/daily/add-osg']" *ngIf="pePermissionService.passPermission('pe/production/add')"><mat-icon>add</mat-icon> Update Operation, SOT & Gas </button>
  <button mat-stroked-button color="secondary" [disabled]="isLoadingResults" [routerLink]="['/pe/production/add']" *ngIf="pePermissionService.passPermission('pe/production/add')"><mat-icon>add</mat-icon> Upload Production</button>
  <button mat-stroked-button color="secondary" (click)="exportExcel()" [disabled]="isLoadingResults"><mat-icon>file_download</mat-icon> Export to Excel</button>

  <div class="table-action-bar-right">
    <button mat-button color="warn" (click)="deleteSelected()" [disabled]="!selection.selected.length" *ngIf="canDeleteManajemen()"><mat-icon>delete</mat-icon> Delete Selected</button>
    <button mat-button color="tertiary" [disabled]="isLoadingResults" [routerLink]="['/pe/daily/manajemen-chart']"><mat-icon>bar_chart</mat-icon>Chart</button>
  </div>
</div>

<div class="container-content">

  <div class="loading-shade" *ngIf="isLoadingResults || isRateLimitReached">
    <mat-spinner *ngIf="isLoadingResults"></mat-spinner>
  </div>
  <div class="container-table" [style.max-height]="(commonService.Math.max(commonService.screenHeight - 180, 250))+'px'">

    <table mat-table [dataSource]="data" class="pe-table"
          matSort matSortActive="date" matSortDisableClear matSortDirection="desc" responsive="true">
        <ng-template #viewNumber let-row let-field="field">
          {{(row[field] ? row[field] : 0) | number : '1.0-2'}}
        </ng-template>
        <ng-template #editNumber let-row let-field="field">
          <input
            matInput
            type="number"
            [(ngModel)]="row[field]"
            [ngModelOptions]="{standalone: true}"
            (keydown.enter)="save(row)"
            (keydown.escape)="cancel(row)"
            [attr.aria-label]="field">
        </ng-template>
        <ng-container matColumnDef="select" [sticky]="!isMobile">
          <th mat-header-cell *matHeaderCellDef rowspan="3">
            <div fxLayout="row" center>
              <mat-checkbox (change)="($event && !isEditing) ? masterToggle() : null"
                            [checked]="selection.hasValue() && isAllSelected()"
                            [indeterminate]="selection.hasValue() && !isAllSelected()"
                            [aria-label]="checkboxLabel()"
                            [disabled]="isEditing" *ngIf="canDeleteManajemen()">
              </mat-checkbox>
            </div>
          </th>
          <td mat-cell *matCellDef="let row">
            <div fxLayout="row" fxLayoutAlign="start center">
              <mat-checkbox (click)="$event.stopPropagation()"
                            (change)="($event && !isEditing) ? selection.toggle(row) : null"
                            [checked]="selection.isSelected(row)"
                            [aria-label]="checkboxLabel(row)"
                            [disabled]="isEditing" *ngIf="canDeleteManajemen()">
              </mat-checkbox>
              </div>
          </td>
        </ng-container>
	  <ng-container matColumnDef="date" sticky>
          <th mat-header-cell *matHeaderCellDef >
            <div fxLayout="row" fxLayoutAlign="center">
              <span mat-sort-header arrowPosition="before" class="mat-sort-header">Date</span>
              <app-xfilter title="Date" column="date" format="date" [selected]="date_xSelected"></app-xfilter>
            </div>
          </th>
          <td mat-cell *matCellDef="let row" class="cell-center" [class.clicked_row]="selection.isSelected(row)">{{row.date ? (row.date | date: 'dd MMM y') : '-'}}</td>
      </ng-container>
      <ng-container matColumnDef="sot">
        <th mat-header-cell *matHeaderCellDef rowspan="2">
          <div fxLayout="row" fxLayoutAlign="center center">
            <span mat-sort-header arrowPosition="before" class="mat-sort-header">SOT</span>
          </div>
        </th>
        <td mat-cell *matCellDef="let row" class="cell-center" [class.clicked_row]="selection.isSelected(row)">
          <ng-container *ngTemplateOutlet="row.isEdit ? editNumber : viewNumber; context: {$implicit: row, field: 'sot'}"></ng-container>
        </td>
      </ng-container>
      <ng-container matColumnDef="operation" >
        <th mat-header-cell *matHeaderCellDef rowspan="5" >
          <div fxLayout="row" fxLayoutAlign="center center">
            <span mat-sort-header arrowPosition="before" class="mat-sort-header">Operation</span>
          </div>
        </th>
        <td mat-cell *matCellDef="let row" class="cell-center" [class.clicked_row]="selection.isSelected(row)">
          <ng-container *ngTemplateOutlet="row.isEdit ? editNumber : viewNumber; context: {$implicit: row, field: 'operation'}"></ng-container>
        </td>
      </ng-container>
      <ng-container matColumnDef="figure" >
        <th mat-header-cell *matHeaderCellDef rowspan="2">
          <div fxLayout="row" fxLayoutAlign="center center">
            <span mat-sort-header arrowPosition="before" class="mat-sort-header">Figure</span>
          </div>
        </th>
        <td mat-cell *matCellDef="let row" class="cell-center" [class.clicked_row]="selection.isSelected(row)">
          <ng-container *ngTemplateOutlet="row.isEdit ? editNumber : viewNumber; context: {$implicit: row, field: 'figure'}"></ng-container>
        </td>
      </ng-container>
      
      <ng-container matColumnDef="gas">
        <th mat-header-cell *matHeaderCellDef rowspan="2">
          <div fxLayout="row" fxLayoutAlign="center center">
            <span mat-sort-header arrowPosition="before" class="mat-sort-header">Gas</span>
          </div>
        </th>
        <td mat-cell *matCellDef="let row" class="cell-center" [class.clicked_row]="selection.isSelected(row)">
          <ng-container *ngTemplateOutlet="row.isEdit ? editNumber : viewNumber; context: {$implicit: row, field: 'gas'}"></ng-container>
        </td>
      </ng-container>
      <ng-container matColumnDef="gas_sales">
        <th mat-header-cell *matHeaderCellDef rowspan="2">
          <div fxLayout="row" fxLayoutAlign="center center">
            <span mat-sort-header arrowPosition="before" class="mat-sort-header">Gas Sales</span>
          </div>
        </th>
        <td mat-cell *matCellDef="let row" class="cell-center" [class.clicked_row]="selection.isSelected(row)">
          <ng-container *ngTemplateOutlet="row.isEdit ? editNumber : viewNumber; context: {$implicit: row, field: 'gas_sales'}"></ng-container>
        </td>
      </ng-container>
    <ng-container matColumnDef="sgt_sot">

        </th>
        <td mat-cell *matCellDef="let row" class="cell-center" [class.clicked_row]="selection.isSelected(row)">
          <ng-container *ngTemplateOutlet="row.isEdit ? editNumber : viewNumber; context: {$implicit: row, field: 'sgt_sot'}"></ng-container>
        </td>

	  <ng-container matColumnDef="sbr_sot">
        <th mat-header-cell *matHeaderCellDef rowspan="2">

        </th>
        <td mat-cell *matCellDef="let row" class="cell-center" [class.clicked_row]="selection.isSelected(row)">
          <ng-container *ngTemplateOutlet="row.isEdit ? editNumber : viewNumber; context: {$implicit: row, field: 'sbr_sot'}"></ng-container>
        </td>
      </ng-container>
	  <ng-container matColumnDef="bd_sot">
        <th mat-header-cell *matHeaderCellDef rowspan="2">

        </th>
        <td mat-cell *matCellDef="let row" class="cell-center" [class.clicked_row]="selection.isSelected(row)">
          <ng-container *ngTemplateOutlet="row.isEdit ? editNumber : viewNumber; context: {$implicit: row, field: 'bd_sot'}"></ng-container>
        </td>
      </ng-container>
	  <ng-container matColumnDef="sgt_opr">
        <th mat-header-cell *matHeaderCellDef rowspan="2">
          <div fxLayout="row" fxLayoutAlign="center center">
            <span mat-sort-header arrowPosition="before" class="mat-sort-header">SGT Operation</span>
          </div>
        </th>
        <td mat-cell *matCellDef="let row" class="cell-center" [class.clicked_row]="selection.isSelected(row)">
          <ng-container *ngTemplateOutlet="row.isEdit ? editNumber : viewNumber; context: {$implicit: row, field: 'sgt_opr'}"></ng-container>
        </td>
      </ng-container>
	  <ng-container matColumnDef="sbr_opr">
        <th mat-header-cell *matHeaderCellDef rowspan="2">
          <div fxLayout="row" fxLayoutAlign="center center">
            <span mat-sort-header arrowPosition="before" class="mat-sort-header">SBR Operation</span>
          </div>
        </th>
        <td mat-cell *matCellDef="let row" class="cell-center" [class.clicked_row]="selection.isSelected(row)">
          <ng-container *ngTemplateOutlet="row.isEdit ? editNumber : viewNumber; context: {$implicit: row, field: 'sbr_opr'}"></ng-container>
        </td>
      </ng-container>
	  <ng-container matColumnDef="bd_opr">
        <th mat-header-cell *matHeaderCellDef rowspan="2">
          <div fxLayout="row" fxLayoutAlign="center center">
            <span mat-sort-header arrowPosition="before" class="mat-sort-header">BD Operation</span>
          </div>
        </th>
        <td mat-cell *matCellDef="let row" class="cell-center" [class.clicked_row]="selection.isSelected(row)">
          <ng-container *ngTemplateOutlet="row.isEdit ? editNumber : viewNumber; context: {$implicit: row, field: 'bd_opr'}"></ng-container>
        </td>
      </ng-container>
    <ng-container matColumnDef="sgt_fig">
        <th mat-header-cell *matHeaderCellDef rowspan="2">
          <div fxLayout="row" fxLayoutAlign="center center">
            <span mat-sort-header arrowPosition="before" class="mat-sort-header">SGT Figure</span>
          </div>
        </th>
        <td mat-cell *matCellDef="let row" class="cell-center" [class.clicked_row]="selection.isSelected(row)">
          <ng-container *ngTemplateOutlet="row.isEdit ? editNumber : viewNumber; context: {$implicit: row, field: 'sgt_fig'}"></ng-container>
        </td>
      </ng-container>
	  <ng-container matColumnDef="sbr_fig">
        <th mat-header-cell *matHeaderCellDef rowspan="2">
          <div fxLayout="row" fxLayoutAlign="center center">
            <span mat-sort-header arrowPosition="before" class="mat-sort-header">SBR Figure</span>
          </div>
        </th>
        <td mat-cell *matCellDef="let row" class="cell-center" [class.clicked_row]="selection.isSelected(row)">
          <ng-container *ngTemplateOutlet="row.isEdit ? editNumber : viewNumber; context: {$implicit: row, field: 'sbr_fig'}"></ng-container>
        </td>
      </ng-container>
	  <ng-container matColumnDef="bd_fig">
        <th mat-header-cell *matHeaderCellDef rowspan="2">

          </div>
        </th>
        <td mat-cell *matCellDef="let row" class="cell-center" [class.clicked_row]="selection.isSelected(row)">
          <ng-container *ngTemplateOutlet="row.isEdit ? editNumber : viewNumber; context: {$implicit: row, field: 'bd_fig'}"></ng-container>
        </td>
      </ng-container>
	  <ng-container matColumnDef="rkap_oil">
        <th mat-header-cell *matHeaderCellDef rowspan="2">
          <div fxLayout="row" fxLayoutAlign="center center">
            <span mat-sort-header arrowPosition="before" class="mat-sort-header">RKAP Oil</span>
          </div>
        </th>
        <td mat-cell *matCellDef="let row" class="cell-center" [class.clicked_row]="selection.isSelected(row)">
          <ng-container *ngTemplateOutlet="row.isEdit ? editNumber : viewNumber; context: {$implicit: row, field: 'rkap_oil'}"></ng-container>
        </td>
      </ng-container>
	  <ng-container matColumnDef="wpnb_oil">
        <th mat-header-cell *matHeaderCellDef rowspan="2">
          <div fxLayout="row" fxLayoutAlign="center center">
            <span mat-sort-header arrowPosition="before" class="mat-sort-header">WP&B Oil</span>
          </div>
        </th>
        <td mat-cell *matCellDef="let row" class="cell-center" [class.clicked_row]="selection.isSelected(row)">
          <ng-container *ngTemplateOutlet="row.isEdit ? editNumber : viewNumber; context: {$implicit: row, field: 'wpnb_oil'}"></ng-container>
        </td>
      </ng-container>
	  <ng-container matColumnDef="rkap_gas">
        <th mat-header-cell *matHeaderCellDef rowspan="2">
          <div fxLayout="row" fxLayoutAlign="center center">
            <span mat-sort-header arrowPosition="before" class="mat-sort-header">RKAP Gas</span>
          </div>
        </th>
        <td mat-cell *matCellDef="let row" class="cell-center" [class.clicked_row]="selection.isSelected(row)">
          <ng-container *ngTemplateOutlet="row.isEdit ? editNumber : viewNumber; context: {$implicit: row, field: 'rkap_gas'}"></ng-container>
        </td>
      </ng-container>
	  <ng-container matColumnDef="wpnb_gas">
        <th mat-header-cell *matHeaderCellDef rowspan="2">
          <div fxLayout="row" fxLayoutAlign="center center">
            <span mat-sort-header arrowPosition="before" class="mat-sort-header">WP&B Gas</span>
          </div>
        </th>
        <td mat-cell *matCellDef="let row" class="cell-center" [class.clicked_row]="selection.isSelected(row)">
          <ng-container *ngTemplateOutlet="row.isEdit ? editNumber : viewNumber; context: {$implicit: row, field: 'wpnb_gas'}"></ng-container>
        </td>
      </ng-container>
       <ng-container matColumnDef="settings">
        <th mat-header-cell *matHeaderCellDef rowspan="2">
          <div fxLayout="row" fxLayoutAlign="center center">
            <mat-icon>settings</mat-icon> Actions
          </div>
        </th>
        <td mat-cell *matCellDef="let row" class="cell-center" width="50px">
          <button
            mat-icon-button
            color="primary"
            [disabled]="isLoadingResults || (isEditing && !row.isEdit)"
            (click)="edit(row)"
            matTooltip="Edit"
            *ngIf="!row.isEdit && pePermissionService.passPermission('pe/production/add')">
            <mat-icon>edit</mat-icon>
          </button>
          <ng-container *ngIf="row.isEdit">
            <button
              mat-icon-button
              color="accent"
              [disabled]="submitting"
              (click)="save(row)"
              matTooltip="Save">
              <mat-icon>check</mat-icon>
            </button>
            <button
              mat-icon-button
              color="warn"
              [disabled]="submitting"
              (click)="cancel(row)"
              matTooltip="Cancel">
              <mat-icon>close</mat-icon>
            </button>
          </ng-container>
        </td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef='headerColumns1; sticky: true'></tr>
      <tr mat-row *matRowDef='let row; columns: displayedColumns;' (click)="(!isEditing) ? selection.toggle(row) : null"></tr>
    </table>

  </div>

  <mat-paginator [length]="resultsLength" [pageSizeOptions]="[50, 100, 150]"></mat-paginator>
  <router-outlet></router-outlet>
  <router-outlet name="overlay2"></router-outlet>
</div>
