
<div class="hero">
  <div class="hero-bg"></div>
  
  <div class="header">
    <!-- <h1>PERTAMINA EP SANGATTA FIELD</h1> -->
  </div>
  
  <div class="card-container" *ngIf="!currentUser">

    <div class="card name" (click)="goAdmin()">
      <div class="icon">
        <mat-icon>person</mat-icon>
      </div>
      <h3>Admin</h3>
    </div>

    <div class="card name" (click)="goViewer()">
      <div class="icon">
        <mat-icon>groups</mat-icon>
      </div>
      <h3> Viewer</h3>
    </div>

  </div>

  <div class="card-container" *ngIf="currentUser">
    <div class="card name" (click)="goDashboard()">
      <div class="icon">
        <mat-icon>{{ isAdmin ? 'admin_panel_settings' : 'visibility' }}</mat-icon>
      </div>
      <h3>{{ isAdmin ? 'Admin Dashboard' : 'Viewer Dashboard' }}</h3>
      <p class="card-sub">{{ displayName }}</p>
    </div>
  </div>
</div>

<footer>
    © Pertamina EP Sangatta Field. All Rights Reserved
</footer>
