<div class="login-page">

  <div class="login-panel">

    <!-- HEADER -->
    <div class="login-header">
      <span class="panel-badge">Admin Panel</span>
      <h1 class="login-title">Selamat datang kembali</h1>
      <p class="login-subtitle">Masuk untuk mengakses dashboard</p>
    </div>

    <mat-progress-bar *ngIf="submitting" class="login-progress" mode="indeterminate"></mat-progress-bar>

    <!-- FORM -->
    <form class="login-form" (ngSubmit)="onSubmit()" [formGroup]="loginForm">

      <mat-form-field class="login-field" appearance="outline" floatLabel="never">
        <mat-icon matPrefix>person</mat-icon>
        <input matInput placeholder="Masukkan username" formControlName="username" autocomplete="username">
        <mat-error *ngIf="f.username.hasError('required') && (f.username.touched || submitting)">
          Username wajib diisi
        </mat-error>
      </mat-form-field>

      <mat-form-field class="login-field" appearance="outline" floatLabel="never">
        <mat-icon matPrefix>lock</mat-icon>
        <input matInput [type]="hide ? 'password' : 'text'" placeholder="Masukkan password"
               formControlName="password" autocomplete="current-password">
        <button type="button" mat-icon-button matSuffix
                (click)="hide = !hide"
                [attr.aria-label]="hide ? 'Tampilkan password' : 'Sembunyikan password'">
          <mat-icon>{{ hide ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
        <mat-error *ngIf="f.password.hasError('required') && (f.password.touched || submitting)">
          Password wajib diisi
        </mat-error>
      </mat-form-field>

      <div class="login-options">
        <mat-checkbox class="remember-check" formControlName="remember" color="primary">Ingat saya</mat-checkbox>
        <a class="forgot-link" href="javascript:void(0)">Lupa password?</a>
      </div>

      <button type="submit" class="login-submit" [disabled]="!loginForm.valid || submitting">
        <span>Masuk ke Sistem</span>
        <mat-icon>arrow_forward</mat-icon>
      </button>

    </form>

    <!-- FOOTER -->
    <div class="login-footer">
      <div class="footer-divider"><span>SISTEM INTERNAL</span></div>
      <!-- <p class="footer-restrict">Akses terbatas untuk personel berwenang.</p> -->
      <p class="footer-brand">PT Pertamina EP — Sangatta Field</p>
    </div>

  </div>

</div>
